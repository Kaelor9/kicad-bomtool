# Builds KiCadBOM.exe and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.1.0 && git push origin v1.1.0
# The program's updater looks for KiCadBOM.exe and KiCadBOM.exe.sha256 on the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pypdf openpyxl pywebview certifi

      - name: Unit tests
        run: python -m tests.test_units

      - name: Stamp version from tag
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > bomtool/__init__.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name KiCadBOM
          --add-data "bomtool/web;bomtool/web"
          --hidden-import pypdf --hidden-import openpyxl --hidden-import certifi
          run_bomtool.py

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum KiCadBOM.exe | awk '{print $1 "  KiCadBOM.exe"}' > KiCadBOM.exe.sha256
          cat KiCadBOM.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KiCadBOM.exe
            dist/KiCadBOM.exe.sha256
          generate_release_notes: true
